<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polimento — ícones, atividade e edição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A1B26;--white:#FFFFFF;--mist:#FDF8FB;--blush:#FCEDF4;--magenta:#C2317A;--deep:#8E1E58;
  --line:#F3E4EC;--line2:#EAD6E1;--stone:#8E7C86;--gold:#C98A2E;--gold-soft:#FBF1DE;--gold-ink:#7A5209;
  --success:#2E6B52;--success-soft:#EAF6F0;--danger:#A63A2E;--danger-soft:#FBEAE7;--accent:var(--magenta);--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--mist);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Darker Grotesque",system-ui,sans-serif;margin:0;line-height:1.05;letter-spacing:-.01em;font-weight:700}
h1{font-size:40px}h3{font-size:20px}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--stone)}
.eyebrow a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.lg{width:22px;height:22px}

/* ---------- barra de protótipo ---------- */
.proto{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px}
.proto span{opacity:.6;margin-right:6px}
.proto button{color:#fff;padding:5px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.2)}
.proto button[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* ---------- casca ---------- */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:calc(100vh - 40px)}
.side{background:var(--white);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;color:#fff;flex:none}
.brand-name{font-family:"Darker Grotesque",sans-serif;font-weight:700;font-size:22px;line-height:1}
.brand-sub{font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#B3A3AC}
.circ{border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.circ .k{font-family:"IBM Plex Mono",monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--stone)}
.circ .row{margin-top:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.circ b{display:block;font-family:"Darker Grotesque",sans-serif;font-size:22px;line-height:1}
.circ small{font-family:"IBM Plex Mono",monospace;font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:#B3A3AC}
nav.main{display:flex;flex-direction:column;gap:1px}
nav.main a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;color:var(--stone);transition:background-color .15s,color .15s}
nav.main a svg{color:#BFAFB8}
nav.main a:hover{background:var(--mist);color:var(--ink)}
nav.main a:hover svg{color:var(--stone)}
nav.main a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);font-weight:600}
nav.main a[aria-current="page"] svg{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 5px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:#BFAFB8}
.side-foot button{display:inline-flex;align-items:center;gap:6px;color:#BFAFB8;font-size:10px}
.side-foot button:hover{color:var(--stone)}
.side-foot svg.i{width:12px;height:12px}
.topbar{display:none}
main{width:100%;max-width:1140px;padding:34px 40px 70px}

/* ---------- blocos ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
.head p{margin-top:7px;max-width:60ch;font-size:14px;color:var(--stone)}
.head-who{display:flex;align-items:center;gap:14px}
.actions{display:flex;flex-wrap:wrap;gap:11px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.card-head h3{display:flex;align-items:center;gap:9px}
.card-head h3 svg{color:var(--stone)}
.link-sm{font-size:12.5px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.split{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}
.stat{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative}
.stat .ic{position:absolute;top:16px;right:16px;color:#D9C3CF}
.stat .n{font-family:"Darker Grotesque",sans-serif;font-weight:700;font-size:38px;line-height:.9}
.stat .l{margin-top:8px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--stone)}
.stat.gold{background:var(--gold-soft);border-color:transparent}
.stat.gold .l{color:#8A5D0C}.stat.gold .ic{color:#E5C88F}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;white-space:nowrap;padding:10px 17px;font-size:13.5px;border-radius:10px;background:var(--accent);color:#fff;transition:filter .15s,background-color .15s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--blush);border-color:var(--blush);filter:none}
.btn.warn{background:var(--danger)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}

.pill{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border-radius:999px;padding:3px 9px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em}
.pill.on{background:var(--success-soft);color:var(--success)}
.pill.wait{background:var(--gold-soft);color:#8A5D0C}
.pill.off{background:#F4F1F3;color:#948A90}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.tag{display:inline-block;border-radius:8px;background:var(--mist);border:1px solid var(--line);padding:2px 8px;font-size:12px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blush);color:var(--deep);display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none}
.avatar.xl{width:58px;height:58px;font-size:20px}

/* ---------- feed de atividade ---------- */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:none;padding-top:0}
.feed .dot{width:32px;height:32px;border-radius:50%;background:var(--blush);color:var(--accent);display:grid;place-items:center}
.feed .dot.gold{background:var(--gold-soft);color:var(--gold)}
.feed .dot.neutral{background:var(--mist);color:var(--stone)}
.feed .txt{font-size:13.5px;line-height:1.45}
.feed .txt b{font-weight:600}
.feed .meta{margin-top:2px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--stone)}

/* ---------- tabela ---------- */
.filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--stone)}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line2);border-radius:10px;background:#fff;font-size:13.5px;outline:none}
.search input:focus{border-color:var(--magenta)}
.chip{padding:6px 11px;border-radius:8px;border:1px solid var(--line2);font-size:12.5px;color:var(--stone);background:#fff}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:transparent;color:var(--accent);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:0 12px 9px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--stone)}
td{border-top:1px solid var(--line);padding:12px;vertical-align:middle}
tr.rowlink{cursor:pointer;transition:background-color .15s}
tr.rowlink:hover{background:var(--mist)}
tr.rowlink td:last-child{color:#D9C3CF;width:24px}
tr.rowlink:hover td:last-child{color:var(--accent)}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;font-weight:600}
.who small{display:block;font-size:12px;color:var(--stone)}

/* ---------- formulário ---------- */
.fld label{display:block;margin-bottom:6px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--stone)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line2);border-radius:10px;background:#fff;padding:10px 12px;font-size:13.5px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--magenta)}
.fld .hint{margin-top:5px;font-size:12px;color:var(--stone)}
.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{margin-top:3px;accent-color:var(--accent)}
.form-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.form-foot small{font-size:12px;color:var(--stone)}
.ok{border-radius:10px;border:1px solid #CDE6DA;background:var(--success-soft);color:var(--success);padding:10px 12px;font-size:13px;display:flex;gap:8px;align-items:center}

/* ---------- acesso ---------- */
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:none;padding-top:0}
.kv span:first-child{color:var(--stone)}
.cred{border-radius:12px;border:1px solid #EFD9A8;background:var(--gold-soft);padding:13px 15px;color:var(--gold-ink)}
.cred .k{font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#8A5D0C}
.cred dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font-size:13px}
.cred dt{color:#8A5D0C}.cred dd{margin:0;font-family:"IBM Plex Mono",monospace;word-break:break-all}
.copy{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#8A5D0C;padding:4px 8px;border-radius:7px;border:1px solid #EFD9A8;background:#fff}
.copy svg.i{width:13px;height:13px}
.cred p{margin-top:10px;font-size:12px;color:#8A5D0C}

/* ---------- confirmação em dois passos ---------- */
.confirm{border-radius:12px;background:var(--danger-soft);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.confirm p{font-size:13px;color:var(--danger)}
.confirm .actions{gap:8px}

.status-opts{display:flex;flex-direction:column;gap:8px}
.status-opts .btn{justify-content:flex-start}
.muted{font-size:12.5px;color:var(--stone);line-height:1.5}
.wallet{display:flex;align-items:center;gap:12px}
.ficha{width:26px;height:26px;border-radius:50%;background:linear-gradient(150deg,#EFC069,#C98A2E);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.ficha+.ficha{margin-left:-12px}

.screen{display:none}.screen.on{display:block}

/* ---------- mobile ---------- */
.phone .shell,.phone-frame .shell{grid-template-columns:1fr}
.phone-wrap{display:flex;justify-content:center;padding:28px 16px}
.phone-frame{width:390px;max-width:100%;border:1px solid var(--line2);border-radius:28px;overflow:hidden;background:var(--mist);box-shadow:0 20px 60px -30px rgba(42,27,38,.35)}
.phone-frame .side{display:none}
.phone-frame .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0}
.phone-frame .menu-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center}
.phone-frame .drawer{display:none;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px 14px}
.phone-frame .drawer.open{display:block}
.phone-frame main{padding:22px 18px 40px}
.phone-frame h1{font-size:33px}
.phone-frame .grid-4{grid-template-columns:1fr 1fr}
.phone-frame .split{grid-template-columns:1fr}

@media (max-width:1000px){.split{grid-template-columns:1fr}.grid-4{grid-template-columns:1fr 1fr}.shell{grid-template-columns:1fr}.side{display:none}main{padding:24px 18px}}
</style>
</head>

<!-- ===================================================== desktop -->
<div class="shell" id="desk">

  <div class="kv"><span>Entrada</span><button class="btn ghost sm" data-confirm="desativar"><svg class="i"><use href="#user-x"/></svg>Desativar acesso</button></div>
</template>

<script>
const NAV=[["layout-dashboard","Painel","painel"],["building-2","Empresas",""],["handshake","Parceiros","parceiros"],["history","Atividade",""],["inbox","Fila de decisões",""],["palette","Personalização",""]];
const FEED=[
  ["user-plus","","<b>João Paulo Ferreira</b> criou o Parceiro <b>Helena Braga</b>","há 3 min"],
  ["coins","gold","<b>João Paulo Ferreira</b> alocou <b>2 fichas</b> para <b>Mariana Costa</b> · Faculdade Aurora","há 6 min"],
  ["file-text","gold","<b>João Paulo Ferreira</b> registrou <b>120 fichas</b> no contrato de <b>Faculdade Aurora</b>","há 6 min"],
  ["pencil","neutral","<b>João Paulo Ferreira</b> editou o Parceiro <b>Rafael Souza</b> — chamada, áreas","hoje, 02:40"],
  ["pause","neutral","<b>João Paulo Ferreira</b> pausou o Parceiro <b>Rafael Souza</b>","hoje, 02:38"],
  ["user-plus","","<b>João Paulo Ferreira</b> criou o Profissional <b>Mariana Costa</b> · Faculdade Aurora","hoje, 02:30"],
];
const CONFIRM={
  pausar:["Pausar Helena? Ela some da busca, mas continua entrando e vendo a agenda.","Pausar"],
  arquivar:["Arquivar Helena? Ela some da busca e perde o acesso. Dá para reativar depois.","Arquivar"],
  desativar:["Desativar o acesso? A próxima entrada é recusada. A carteira e o histórico ficam.","Desativar"],
};
let current="painel";
function navHtml(sel){return NAV.map(([ic,l,go])=>`<a href="#" data-go="${go}" ${go===sel||(sel==="parceiro"&&go==="parceiros")?'aria-current="page"':""}><svg class="i"><use href="#${ic}"/></svg>${l}</a>`).join("")}
function render(go){
  const mobile=go==="mobile";
  document.getElementById("desk").hidden=mobile;
  document.getElementById("mob").hidden=!mobile;
  const screen=mobile?"painel":go;
  const target=document.getElementById(mobile?"stageMob":"stage");
  target.innerHTML=document.getElementById("t-"+screen).innerHTML;
  document.getElementById("nav").innerHTML=navHtml(screen);
  document.getElementById("navMob").innerHTML=navHtml(screen);
  target.querySelectorAll("#feed").forEach(ul=>ul.innerHTML=FEED.map(([ic,t,txt,q])=>`<li><div class="dot ${t}"><svg class="i"><use href="#${ic}"/></svg></div><div><div class="txt">${txt}</div><div class="meta" title="25/09/2026 02:59">${q}</div></div></li>`).join(""));
  target.querySelectorAll("[data-acesso]").forEach(c=>c.innerHTML=document.getElementById("t-acesso").innerHTML);
  document.querySelectorAll(".proto button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.go===go));
  current=go;window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");
  if(go&&go.dataset.go){e.preventDefault();render(go.dataset.go);return}
  const c=e.target.closest("[data-confirm]");
  if(c){
    const [msg,label]=CONFIRM[c.dataset.confirm];
    const box=document.createElement("div");box.className="confirm";
    box.innerHTML=`<p>${msg}</p><div class="actions"><button class="btn warn sm">${label}</button><button class="btn ghost sm" data-cancel>Cancelar</button></div>`;
    c.replaceWith(box);box.querySelector("[data-cancel]").focus();
    box._orig=c;return;
  }
  const cancel=e.target.closest("[data-cancel]");
  if(cancel){const box=cancel.closest(".confirm");box.replaceWith(box._orig);box._orig.focus();return}
  const s=e.target.closest("[data-senha]");
  if(s){
    const slot=s.closest(".card").querySelector("[data-cred]");
    slot.innerHTML=`<div class="cred" style="margin:4px 0 10px"><div class="k">Acesso provisório — copie agora</div><dl><dt>E-mail</dt><dd>helena@exemplo.com.br</dd><button class="copy" data-copy><svg class="i"><use href="#copy"/></svg>Copiar</button><dt>Senha</dt><dd><b>Kq7!mZ2p#Rt9vXa4</b></dd><button class="copy" data-copy><svg class="i"><use href="#copy"/></svg>Copiar</button></dl><p>Recarregar a página apaga esta senha. Se ela se perder, gere outra aqui.</p></div>`;
    return;
  }
  const cp=e.target.closest("[data-copy]");
  if(cp){cp.innerHTML='<svg class="i"><use href="#check"/></svg>Copiado';setTimeout(()=>cp.innerHTML='<svg class="i"><use href="#copy"/></svg>Copiar',1800)}
  if(e.target.closest("#menuBtn")){const d=document.getElementById("drawer"),b=document.getElementById("menuBtn");const o=d.classList.toggle("open");b.setAttribute("aria-expanded",o);b.innerHTML=`<svg class="i"><use href="#${o?"x":"menu"}"/></svg>`}
  document.querySelectorAll(".chip").forEach(ch=>{if(e.target===ch){ch.parentNode.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));ch.setAttribute("aria-pressed","true")}});
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const b=document.querySelector(".confirm [data-cancel]");if(b)b.click()}});
render("painel");
</script>
