<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo F0 · v2 — App de Mentoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A1B26;
  --white:#FFFFFF;
  --mist:#FDF8FB;
  --blush:#FCEDF4;
  --magenta:#C2317A;
  --deep:#8E1E58;
  --line:#F3E4EC;
  --line2:#EAD6E1;
  --stone:#8E7C86;
  --gold:#C98A2E;
  --gold-soft:#FBF1DE;
  --accent:var(--magenta);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--mist);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Darker Grotesque",system-ui,sans-serif;margin:0;line-height:1.05;letter-spacing:-.01em;font-weight:700}
h1{font-size:40px}
h2{font-size:26px}
h3{font-size:20px}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--accent)}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--stone)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--blush)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.side{background:var(--white);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;color:#fff;flex:none}
.brand-name{font-family:"Darker Grotesque";font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1}
.brand-sub{font-size:9.5px;color:#B3A3AC;font-family:"IBM Plex Mono",monospace;letter-spacing:.12em}

.persona{border:1px solid var(--line);border-radius:12px;padding:8px}
.persona-label{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#B3A3AC;padding:2px 6px 8px}
.persona-btn{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:7px 9px;border-radius:8px;color:var(--stone);font-size:13px}
.persona-btn:hover{background:var(--mist);color:var(--ink)}
.persona-btn[aria-current="true"]{background:var(--blush);color:var(--deep);font-weight:600}
.persona-btn small{font-family:"IBM Plex Mono",monospace;font-size:9px;opacity:.7}

.nav{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--stone);font-size:13.5px;text-align:left;width:100%}
.nav-item:hover{background:var(--mist);color:var(--ink)}
.nav-item[aria-current="page"]{background:var(--blush);color:var(--deep);font-weight:600}
.nav-item .ic{width:15px;text-align:center;font-size:12px;opacity:.9}
.nav-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:20px}

.purse{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:11px 12px}
.purse-row{display:flex;align-items:center;gap:9px}
.purse-n{font-family:"Darker Grotesque";font-size:30px;font-weight:700;line-height:1}
.purse-l{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone)}
.side-foot{margin-top:auto;font-size:10px;color:#BFAFB8;font-family:"IBM Plex Mono",monospace;padding:0 5px;line-height:1.6}

.main{padding:34px 40px 70px;max-width:1140px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.topbar .sub{color:var(--stone);font-size:14px;margin-top:7px;max-width:60ch}

/* ---------- primitives ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.flat{border-color:transparent;background:var(--white)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.btn{background:var(--accent);color:#fff;padding:10px 17px;border-radius:10px;font-weight:600;font-size:13.5px;transition:filter .12s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--white);color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--blush);filter:none;border-color:var(--blush)}
.btn.warn{background:#A63A2E}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn.gold{background:var(--gold)}
.pill{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--mist);color:var(--stone);white-space:nowrap}
.pill.on{background:#EAF6F0;color:#2E6B52}
.pill.wait{background:var(--gold-soft);color:#8A5D0C}
.pill.off{background:#F4F1F3;color:#948A90}
.pill.bad{background:#FBEAE7;color:#A63A2E}
.pill.pink{background:var(--blush);color:var(--deep)}
.tag{background:var(--mist);border-radius:7px;padding:3px 9px;font-size:11.5px;color:#6E5F68}
.stat{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stat .n{font-family:"Darker Grotesque";font-size:38px;font-weight:700;line-height:.9}
.stat .l{font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--stone);margin-top:8px}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;color:#fff;flex:none}
.av.lg{width:58px;height:58px;font-size:18px;border-radius:16px}
.av.xl{width:76px;height:76px;font-size:24px;border-radius:20px}
.av.sm{width:29px;height:29px;font-size:10.5px;border-radius:9px}
.divider{height:1px;background:var(--line);margin:16px 0}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:28px;text-align:center;color:var(--stone);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--stone);padding:0 12px 10px;font-weight:500}
td{padding:13px 12px;border-top:1px solid var(--line);vertical-align:middle}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--white);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
label.f{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--stone);margin-bottom:6px}
.field{margin-bottom:15px}
.note{background:var(--blush);border-radius:12px;padding:13px 15px;font-size:13px;color:var(--deep);display:flex;gap:11px;line-height:1.5}
.note.gold{background:var(--gold-soft);color:#7A5209}

/* ---------- moeda ---------- */
.coin{display:inline-grid;place-items:center;border-radius:50%;background:linear-gradient(150deg,#EFC069,var(--gold));color:#5A3A02;font-family:"IBM Plex Mono",monospace;font-weight:600;flex:none;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}
.coin.s{width:16px;height:16px;font-size:8.5px}
.coin.m{width:22px;height:22px;font-size:11px}
.coin.l{width:38px;height:38px;font-size:17px}
.coin.xl{width:70px;height:70px;font-size:32px}
.price{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:#7A5209;background:var(--gold-soft);padding:4px 9px 4px 6px;border-radius:20px}
.coinstack{display:flex}
.coinstack .coin{margin-left:-6px;border:1.5px solid var(--white)}
.coinstack .coin:first-child{margin-left:0}

/* ---------- trilho de horários ---------- */
.rail{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--white)}
.rail-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.rail-day{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.rail-count{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--stone)}
.rail-track{display:flex;gap:6px;flex-wrap:wrap}
.slot{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;padding:6px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--white);color:var(--deep);transition:all .12s}
.slot:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.slot.taken{background:var(--mist);border-color:var(--line);color:#C6B8C0;cursor:not-allowed;text-decoration:line-through}
.slot.taken:hover{background:var(--mist);color:#C6B8C0;border-color:var(--line)}

/* ---------- grade semanal ---------- */
.wk{display:grid;grid-template-columns:52px repeat(7,1fr);gap:4px;user-select:none}
.wk-h{font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--stone);text-align:center;padding-bottom:6px}
.wk-t{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--stone);text-align:right;padding-right:8px;line-height:26px}
.cell{height:26px;border-radius:7px;background:var(--mist);border:1px solid transparent;cursor:pointer;transition:background .1s}
.cell:hover{border-color:var(--accent)}
.cell.on{background:var(--accent);border-color:var(--accent)}
.cell.blk{background:repeating-linear-gradient(45deg,#F5E3E1 0 4px,#FCF1F0 4px 8px)}

/* ---------- mentores ---------- */
.mcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:13px;transition:border-color .15s}
.mcard:hover{border-color:var(--line2)}
.mcard.feat{border-color:var(--blush);background:linear-gradient(var(--white),var(--white)) padding-box,linear-gradient(160deg,var(--blush),var(--white)) border-box;border:1px solid transparent;box-shadow:0 1px 0 var(--blush)}
.mcard-name{font-family:"Darker Grotesque";font-weight:700;font-size:23px;line-height:1}
.mcard-role{font-size:12.5px;color:var(--stone);margin-top:2px}
.mcard-bio{font-size:13px;color:#6E5F68;line-height:1.5}

/* ---------- chat IA ---------- */
.aiwrap{background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ai-top{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;background:linear-gradient(var(--white),var(--mist))}
.ai-steps{display:flex;gap:5px;align-items:center;margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.dot.on{background:var(--accent)}
.dot.done{background:var(--blush)}
.crumbs{display:flex;gap:7px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--mist);min-height:47px;align-items:center}
.crumb{display:inline-flex;align-items:center;gap:7px;background:var(--white);border:1px solid var(--line2);border-radius:20px;padding:4px 6px 4px 11px;font-size:12.5px}
.crumb .x{width:17px;height:17px;border-radius:50%;background:var(--blush);color:var(--deep);display:grid;place-items:center;font-size:10px;font-weight:600}
.crumb:hover .x{background:var(--accent);color:#fff}
.crumb-hint{font-size:12.5px;color:#B3A3AC}
.ai-body{padding:22px 20px}
.ask{font-family:"Darker Grotesque";font-size:29px;font-weight:700;line-height:1.05;max-width:24ch}
.ask-sub{color:var(--stone);font-size:13px;margin-top:8px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
.opt{border:1px solid var(--line2);border-radius:12px;padding:14px 15px;text-align:left;background:var(--white);display:flex;gap:12px;align-items:flex-start;transition:all .13s}
.opt:hover{border-color:var(--accent);background:var(--blush)}
.opt .oic{width:30px;height:30px;border-radius:9px;background:var(--blush);color:var(--deep);display:grid;place-items:center;font-size:14px;flex:none}
.opt:hover .oic{background:var(--white)}
.opt b{font-weight:600;font-size:13.5px}
.opt small{display:block;color:var(--stone);font-size:11.5px;line-height:1.4;margin-top:2px}
.ai-foot{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center;background:var(--mist)}
.ai-foot input{background:var(--white)}
.thinking{display:flex;gap:5px;align-items:center;color:var(--stone);font-size:13px;padding:6px 0}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--line2);display:inline-block;animation:bl 1.1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.35}30%{opacity:1}}
.res{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;gap:14px;margin-top:12px;background:var(--white)}
.why{background:var(--blush);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--deep);margin:9px 0}

/* ---------- sala ---------- */
.room{background:#FBF4F8;border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:14px;grid-template-columns:1fr 300px}
.tile{background:var(--white);border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;min-height:270px;position:relative}
.tile-name{position:absolute;bottom:11px;left:11px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--stone);background:var(--mist);padding:4px 10px;border-radius:20px}
.tile.small{min-height:100px;max-width:154px}
.ctrl{display:flex;gap:9px;justify-content:center}
.cbtn{width:42px;height:42px;border-radius:13px;background:var(--white);border:1px solid var(--line2);display:grid;place-items:center;font-size:15px}
.cbtn:hover{background:var(--blush);border-color:var(--blush)}
.cbtn.end{background:#A63A2E;color:#fff;border-color:#A63A2E}
.timer{font-family:"IBM Plex Mono",monospace;font-size:22px;letter-spacing:.03em}

/* ---------- presente ---------- */
.gift{border:2px dashed var(--line2);border-radius:16px;padding:22px;text-align:center;transition:all .2s;background:var(--white)}
.gift.armed{border-style:solid;border-color:var(--gold);background:var(--gold-soft)}
.giftpop{animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
.spark{position:absolute;font-size:13px;animation:fly .8s ease-out forwards}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.giftpop,.spark,.thinking i{animation:none}}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(42,27,38,.34);display:none;z-index:40}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:var(--mist);z-index:41;transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;padding:26px 24px;border-left:1px solid var(--line)}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}

@media(max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto}
  .main{padding:24px 18px 60px}
  .g2,.g3,.g4,.opts{grid-template-columns:1fr}
  .room{grid-template-columns:1fr}
  h1{font-size:33px}
  .wk{grid-template-columns:42px repeat(7,1fr)}
}
</style>
</head>

  <aside class="side">
    <div class="brand">

  <main class="main" id="main"></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-live="polite"></aside>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const av=(i,c,cls='')=>`<div class="av ${cls}" style="background:${c}">${i}</div>`;
const coin=(cls='m')=>`<span class="coin ${cls}">◎</span>`;
const price=n=>`<span class="price">${coin('s')} ${n}</span>`;
const stack=n=>`<span class="coinstack">${Array.from({length:Math.min(n,6)},()=>coin('m')).join('')}</span>`;
const stPill=st=>({active:'<span class="pill on">Ativo</span>',pending_review:'<span class="pill wait">Aguarda aprovação</span>',

function railHTML(dia,slots,taken=[]){
  return `<div class="rail"><div class="rail-head"><span class="rail-day">${dia}</span>
   <span class="rail-count">${slots.length-taken.length} livre${slots.length-taken.length===1?'':'s'}</span></div>
   <div class="rail-track">${slots.map(s=>`<button class="slot ${taken.includes(s)?'taken':''}" ${taken.includes(s)?'disabled':''} data-slot="${dia} ${s}">${s}</button>`).join('')}</div></div>`;
}
function sessionRow(b,role){
  return `<div class="card" style="display:flex;gap:15px;align-items:center;padding:16px 18px">
   ${av(b.ini,b.cor)}
   <div style="flex:1;min-width:160px">

}

/* ==================== chat IA ==================== */
function iaAnswer(txt){
 S.ia.answers[S.ia.step]=txt; S.ia.step++;
 if(S.ia.step>=FLOW.length){S.ia.thinking=true;render();setTimeout(()=>{S.ia.thinking=false;render();},1100);}
 else render();
}

/* ==================== grade ==================== */
function renderWk(){
 const el=document.getElementById('wk'); if(!el)return;
 let out='<div></div>'+DIAS.map(d=>`<div class="wk-h">${d}</div>`).join('');
 HORAS.forEach(hh=>{out+=`<div class="wk-t">${String(hh).padStart(2,'0')}</div>`;
  DIAS.forEach((_,d)=>{const k=d+'-'+hh;
   out+=`<div class="cell ${S.avail.has(k)?'on':''} ${S.blocks.has(k)?'blk':''}" data-cell="${k}" role="button" tabindex="0" aria-label="${DIAS[d]} ${hh}h"></div>`;});});
 el.innerHTML=out; upCount();
}
function upCount(){const c=document.getElementById('availCount'); if(c)c.textContent=S.avail.size+' horas abertas por semana';}
let painting=false,paintTo=true;
document.addEventListener('mousedown',e=>{const c=e.target.closest('[data-cell]'); if(!c)return;
 painting=true;paintTo=!S.avail.has(c.dataset.cell);toggleCell(c);});
document.addEventListener('mouseover',e=>{if(!painting)return;const c=e.target.closest('[data-cell]');if(c)toggleCell(c);});
document.addEventListener('mouseup',()=>painting=false);
function toggleCell(c){const k=c.dataset.cell;paintTo?S.avail.add(k):S.avail.delete(k);c.classList.toggle('on',paintTo);upCount();}

 document.getElementById('nav').innerHTML=NAV[S.persona].map(n=>
  `<button class="nav-item" data-go="${n.id}" aria-current="${S.view===n.id?'page':'false'}">
   <span class="ic">${n.ic}</span>${n.t}${n.badge?`<span class="badge">${n.badge}</span>`:''}</button>`).join('');
 const key=S.view==='sala'?'sala':S.persona+'_'+S.view;
 document.getElementById('main').innerHTML=(V[key]||V[S.persona+'_home'])();
 window.scrollTo(0,0); renderWk();
}
const go=v=>{S.view=v;render();};

document.addEventListener('click',e=>{
 const t=e.target;
 const p=t.closest('[data-persona]'); if(p){S.persona=p.dataset.persona;S.view='home';render();return;}
 const g=t.closest('[data-go]'); if(g){go(g.dataset.go);return;}
 const dr=t.closest('[data-drawer]'); if(dr){openDrawer(dr.dataset.drawer);return;}
 if(t.closest('[data-close]')||t.id==='scrim'){closeDrawer();return;}
 if(t.closest('[data-end-session]')){S.persona='mentor';S.gift=false;S.giftDone=false;S.nota=0;go('encerrar');return;}
 const sl=t.closest('.slot:not(.taken)'); if(sl){S.slot=sl.dataset.slot;openDrawer('reserva');return;}
 const op=t.closest('[data-opt]'); if(op){iaAnswer(op.dataset.opt);return;}
 const uc=t.closest('[data-uncrumb]'); if(uc){const i=+uc.dataset.uncrumb;S.ia.answers=S.ia.answers.slice(0,i);S.ia.step=i;render();return;}
 if(t.closest('[data-ia-send]')){const i=document.getElementById('iaInput');if(i&&i.value.trim())iaAnswer(i.value.trim());return;}
 const nt=t.closest('[data-nota]'); if(nt){S.nota=+nt.dataset.nota;render();return;}
 const gf=t.closest('[data-gift]'); if(gf){S.gift=gf.dataset.gift==='1';render();return;}
 if(t.closest('[data-send-review]')){if(S.gift){S.cotaPresente=Math.max(S.cotaPresente-1,0);S.saldo++;}S.giftDone=true;render();return;}
 const ac=t.closest('[data-accent]'); if(ac){S.brand.accent=ac.dataset.accent;render();return;}
 if(t.closest('[data-add-area]')){const i=document.getElementById('fArea');if(i.value.trim()){S.areas.push(i.value.trim());render();}return;}
 const da=t.closest('[data-del-area]'); if(da){S.areas.splice(+da.dataset.delArea,1);render();return;}
 if(t.closest('[data-clear-avail]')){S.avail.clear();renderWk();return;}
 const rs=t.closest('[data-reset]'); if(rs){
  if(rs.dataset.reset==='brand')S.brand={name:'Mentoria',accent:'#C2317A',mark:'M'};
  if(rs.dataset.reset==='ia')S.ia={step:0,answers:[],thinking:false};
  if(rs.dataset.reset==='gift'){S.gift=false;S.giftDone=false;S.nota=0;}
  render();return;}
});
document.addEventListener('input',e=>{
 if(e.target.id==='fName'){S.brand.name=e.target.value||'Mentoria';document.getElementById('brandName').textContent=S.brand.name;}
 if(e.target.id==='fMark'){S.brand.mark=e.target.value||'M';document.getElementById('brandMark').textContent=S.brand.mark;}
 if(e.target.id==='fAccent'){S.brand.accent=e.target.value;document.documentElement.style.setProperty('--accent',e.target.value);}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeDrawer();
 if((e.key===' '||e.key==='Enter')&&e.target.dataset&&e.target.dataset.cell){
  e.preventDefault();paintTo=!S.avail.has(e.target.dataset.cell);toggleCell(e.target);}
});
render();
</script>
</body>
</html>
