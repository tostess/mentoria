<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P5 — sala, presença e presente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A1B26;--white:#FFFFFF;--mist:#FDF8FB;--blush:#FCEDF4;--magenta:#C2317A;--deep:#8E1E58;
  --line:#F3E4EC;--line2:#EAD6E1;--stone:#8E7C86;--gold:#C98A2E;--gold-soft:#FBF1DE;--gold-ink:#7A5209;
  --success:#2E6B52;--success-soft:#EAF6F0;--danger:#A63A2E;--danger-soft:#FBEAE7;--accent:var(--magenta);--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--mist);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Darker Grotesque",system-ui,sans-serif;margin:0;line-height:1.05;letter-spacing:-.01em;font-weight:700}
h1{font-size:40px}h2{font-size:26px}h3{font-size:20px}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
code{font-family:"IBM Plex Mono",monospace;font-size:.92em}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--stone)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:13px;height:13px}
svg.i.lg{width:22px;height:22px}

/* ---------- barra de protótipo ---------- */
.proto{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 14px;font-family:"IBM Plex Mono",monospace;font-size:11px}
.proto span{opacity:.6;margin:0 6px 0 4px}
.proto button{color:#fff;padding:5px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.2)}
.proto button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.proto .sep{width:1px;height:18px;background:rgba(255,255,255,.2);margin:0 4px}

/* ---------- casca ---------- */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:calc(100vh - 40px)}
.side{background:var(--white);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.brand-mark{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px;color:#fff;flex:none}
.brand-name{font-family:"Darker Grotesque",sans-serif;font-weight:700;font-size:22px;line-height:1}
.brand-sub{font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#B3A3AC}
.saldo-side{border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px}
.saldo-side b{font-family:"Darker Grotesque",sans-serif;font-size:26px;line-height:1}
.saldo-side small{display:block;font-family:"IBM Plex Mono",monospace;font-size:8.5px;text-transform:uppercase;letter-spacing:.1em;color:#B3A3AC}
nav.main{display:flex;flex-direction:column;gap:1px}
nav.main a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;color:var(--stone)}
nav.main a svg{color:#BFAFB8}
nav.main a[aria-current="page"]{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent);font-weight:600}
nav.main a[aria-current="page"] svg{color:var(--accent)}
.side-foot{margin-top:auto;padding:0 5px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:#BFAFB8}
main{width:100%;max-width:1140px;padding:34px 40px 70px}

/* ---------- blocos ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
.head p{margin-top:7px;max-width:62ch;font-size:14px;color:var(--stone)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
.card-head h3{display:flex;align-items:center;gap:9px}
.card-head h3 svg{color:var(--stone)}
.stack{display:flex;flex-direction:column;gap:18px}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
.muted{font-size:12.5px;color:var(--stone);line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;white-space:nowrap;padding:10px 17px;font-size:13.5px;border-radius:10px;background:var(--accent);color:#fff;transition:filter .15s,background-color .15s}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{background:var(--blush);border-color:var(--blush);filter:none}
.btn.gold{background:var(--gold);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;border-radius:999px;padding:3px 9px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em}
.pill.on{background:var(--success-soft);color:var(--success)}
.pill.wait{background:var(--gold-soft);color:#8A5D0C}
.pill.off{background:#F4F1F3;color:#948A90}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blush);color:var(--deep);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.avatar.lg{width:46px;height:46px;font-size:16px}
.note{border-radius:12px;background:color-mix(in srgb,var(--accent) 7%,#fff);padding:12px 14px;font-size:13px;display:flex;gap:10px;color:var(--ink)}
.note svg{color:var(--accent);margin-top:2px}
.ok{border-radius:12px;border:1px solid #CDE6DA;background:var(--success-soft);color:var(--success);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}

/* ficha */
.ficha{display:inline-block;border-radius:50%;background:linear-gradient(150deg,#EFC069,#C98A2E);box-shadow:inset 0 -1px 0 rgba(0,0,0,.14),0 1px 1px rgba(90,58,2,.18);position:relative;width:22px;height:22px;flex:none}
.ficha::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1px dashed rgba(255,255,255,.65)}
.ficha.s{width:16px;height:16px}.ficha.s::after{inset:2px}
.ficha.xl{width:54px;height:54px}.ficha.xl::after{inset:6px;border-width:1.5px}
.fichas{display:inline-flex}.fichas .ficha+.ficha{margin-left:-6px;box-shadow:0 0 0 1.5px #fff}

/* ---------- listas de sessão ---------- */
.sess{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.sess li{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.sess li:first-child{border-top:none;padding-top:0}
.cal{border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 0 7px;background:#fff}
.cal small{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.cal b{display:block;font-family:"Darker Grotesque",sans-serif;font-size:24px;line-height:1}
.cal.past small,.cal.past b{color:var(--stone)}
.sess .who{display:flex;align-items:center;gap:10px;min-width:0}
.sess .who b{font-weight:600}
.sess .meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--stone);margin-top:1px}
.sess .sub{font-size:12.5px;color:var(--stone);margin-top:4px}
.sess .right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.sess .fix{grid-column:2/-1;border-radius:12px;background:var(--mist);border:1px solid var(--line);padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sess .fix p{font-size:13px;max-width:52ch}
.link-sm{font-size:12.5px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}

.hero{background:#fff;border:1px solid color-mix(in srgb,var(--accent) 30%,#fff);border-radius:var(--r);padding:22px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.hero .cal{width:72px;padding:9px 0 10px}.hero .cal b{font-size:32px}
.hero .quando{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent);font-weight:500}

/* ---------- sala ---------- */
.room{display:grid;grid-template-rows:auto 1fr;height:calc(100vh - 40px);min-height:560px;background:var(--mist)}
.room-top{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
.room-top .back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--stone)}
.room-top .back:hover{color:var(--accent)}
.room-top .quem{display:flex;align-items:center;gap:10px;min-width:0}
.room-top .quem b{font-weight:600;display:block;line-height:1.2}
.room-top .quem small{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--stone)}
.room-top .vr{width:1px;height:28px;background:var(--line)}
.room-body{display:grid;grid-template-columns:1fr 300px;gap:16px;padding:16px 20px 20px;min-height:0}
.video{position:relative;border-radius:var(--r);background:#1E1319;overflow:hidden;display:grid;grid-template-rows:1fr auto;min-height:0}
.video .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:32px 14px 14px}
.tile{border-radius:12px;background:#2D2029;position:relative;display:grid;place-items:center;min-height:120px}
.tile .avatar{width:74px;height:74px;font-size:24px;background:#43303D;color:#F1DCE7}
.tile .nome{position:absolute;left:10px;bottom:10px;font-size:12px;color:#F1DCE7;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:6px}
.video .ctl{display:flex;justify-content:center;gap:10px;padding:10px 0 14px}
.video .ctl i{width:38px;height:38px;border-radius:50%;background:#3A2A34;display:block}
.video .ctl i.red{background:#8C2F2A;width:54px;border-radius:19px}
.video .tag-daily{position:absolute;right:12px;top:10px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9E8795}
.video .aviso-prebuilt{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:12.5px;padding:6px 12px;border-radius:8px;box-shadow:0 6px 20px -10px #000}
.panel{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.panel .card{padding:16px}

/* relógio */
.clock{margin-left:auto;display:flex;align-items:center;gap:12px;border-radius:12px;padding:7px 14px 8px;background:var(--mist);border:1px solid var(--line)}
.clock .lbl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--stone);line-height:1.25}
.clock .lbl b{display:block;font-family:"Instrument Sans",sans-serif;text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;color:var(--ink)}
.clock .t{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:500;line-height:1}
.clock.fim{background:var(--gold-soft);border-color:transparent}
.clock.fim .t,.clock.fim .lbl{color:#8A5D0C}
.clock.extra{background:var(--danger-soft);border-color:transparent}
.clock.extra .t,.clock.extra .lbl{color:var(--danger)}

/* presente */
.gift-q{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--stone);margin:2px 0 14px}
.gift-q .dots{display:inline-flex;gap:4px}
.gift-q .dots i{width:10px;height:10px;border-radius:50%;background:var(--gold)}
.gift-q .dots i.used{background:var(--line2)}
.gift-confirm{border-radius:12px;background:var(--gold-soft);padding:12px 14px;margin-bottom:10px;font-size:13px;color:#6B470A}
.gift-done{display:flex;gap:12px;align-items:center;border-radius:12px;background:var(--gold-soft);padding:14px}
.gift-done p{font-size:13px;color:#6B470A}
.gift-done b{color:var(--gold-ink)}

/* chegada do presente (Profissional) */
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px 18px 14px 14px;box-shadow:0 18px 50px -18px rgba(0,0,0,.55);min-width:320px}
.toast b{display:block;font-family:"Darker Grotesque",sans-serif;font-size:22px;line-height:1.05}
.toast small{font-size:12.5px;color:var(--stone)}

/* animação: só aqui (sistema de design) */
@keyframes cair{0%{transform:translateY(-28px) scale(.55) rotateY(0);opacity:0}60%{opacity:1}100%{transform:translateY(0) scale(1) rotateY(720deg);opacity:1}}
@keyframes brilho{0%{box-shadow:0 0 0 0 rgba(201,138,46,.55)}100%{box-shadow:0 0 0 18px rgba(201,138,46,0)}}
@keyframes entrar{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.anima .ficha{animation:cair .95s cubic-bezier(.2,.8,.2,1) both,brilho 1.1s .85s ease-out 1}
.toast.anima{animation:entrar .35s ease-out both}
@media (prefers-reduced-motion:reduce){.anima .ficha,.toast.anima{animation:none}}

/* telas de antes e depois */
.gate{display:grid;place-items:center;padding:60px 20px}
.gate .box{max-width:460px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.gate .big{font-family:"IBM Plex Mono",monospace;font-size:44px;font-weight:500;line-height:1}
.gate .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.resumo{display:flex;flex-direction:column;margin:4px 0 0;width:100%}
.resumo .kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:9px 0;border-top:1px solid var(--line);text-align:left}
.resumo .kv span:first-child{color:var(--stone)}
.resumo .kv b{font-weight:600;text-align:right}

/* ---------- anotações ---------- */
.anot{margin:26px auto 0;max-width:1100px;border:1px dashed #D9C3CF;border-radius:12px;padding:14px 16px;background:#fff;font-size:12.5px;color:var(--stone)}
.anot b{color:var(--ink)}
.anot ul{margin:6px 0 0;padding-left:18px}
.anot li{margin:3px 0}
.room + .anot{margin:18px 20px 40px}

/* ---------- celular ---------- */
.phone-wrap{display:flex;justify-content:center;padding:28px 16px}
.phone-frame{width:390px;max-width:100%;height:780px;border:1px solid var(--line2);border-radius:28px;overflow:hidden;background:var(--mist);box-shadow:0 20px 60px -30px rgba(42,27,38,.35);display:flex;flex-direction:column}
.phone-frame .room{height:auto;flex:1;min-height:0}
.phone-frame .room-top{flex-wrap:wrap;gap:10px;padding:10px 14px}
.phone-frame .room-top .vr,.phone-frame .room-top .quem small{display:none}
.phone-frame .clock{padding:5px 10px 6px}.phone-frame .clock .t{font-size:20px}.phone-frame .clock .lbl b{display:none}
.phone-frame .room-body{grid-template-columns:1fr;grid-template-rows:1fr auto;padding:10px;gap:10px}
.phone-frame .video .tiles{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
.phone-frame .panel{overflow:visible}
.phone-frame .panel .card.info{display:none}
.phone-frame .toast{min-width:0;width:calc(100% - 24px)}
.phone-frame .anot{display:none}

@media (max-width:1000px){.split{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{display:none}main{padding:24px 16px}.room{height:auto}.room-body{grid-template-columns:1fr}.video{min-height:420px}.hero{grid-template-columns:auto 1fr}}
</style>
</head>

</svg>

<div class="proto" role="toolbar" aria-label="Telas do protótipo">
  <span>Profissional</span>
  <button data-go="inicio" aria-pressed="true">Início (hoje)</button>
  <button data-go="antes">Cedo demais</button>
  <button data-go="sala-prof">Sala</button>
  <button data-go="fim-prof">Fim</button>
  <button data-go="agenda">Agenda depois</button>
  <div class="sep"></div>
  <span>Parceiro</span>
  <button data-go="sala-parc">Sala</button>
  <button data-go="p-sessoes">Sessões depois</button>
  <div class="sep"></div>
  <button data-go="mobile">Celular (390px)</button>
  <div class="sep"></div>
  <span>Relógio</span>
  <button data-rel="1122">Faltam 18 min</button>
  <button data-rel="190">Faltam 3 min</button>
  <button data-rel="-40">Passou do fim</button>
</div>

<div id="app"></div>

<!-- ============================================ Profissional: início no dia -->
<template id="t-inicio">
  <div class="shell">
    <aside class="side">

<script>
const PARC_PANEL=`
  <div class="card info"><span class="eyebrow">Com você</span>
    <div style="display:flex;gap:10px;align-items:center;margin-top:10px"><div class="avatar lg">MC</div><div><b style="font-weight:600">Mariana Costa</b><div class="muted">Coordenadora pedagógica · Faculdade Aurora</div></div></div>
  </div>
  <div class="card" data-gift></div>`;
const PROF_PANEL=`
  <div class="card info"><span class="eyebrow">Com você</span>
    <div style="display:flex;gap:10px;align-items:center;margin-top:10px"><div class="avatar lg">HB</div><div><b style="font-weight:600">Helena Braga</b><div class="muted">Liderança em ambiente clínico</div></div></div>
  </div>
  <div class="card"><span class="eyebrow">Sua carteira</span>
    <div style="display:flex;align-items:center;gap:10px;margin-top:10px"><span class="fichas" data-fichas><i class="ficha"></i><i class="ficha"></i><i class="ficha"></i></span><b class="mono" style="font-size:20px" data-saldo>4</b><span class="muted">fichas</span></div>
    <button class="btn ghost sm block" style="margin-top:14px" data-simular-presente>Protótipo: Helena presenteia</button>
  </div>`;
const ANOT_PARC=`<b>Anotações — sala do Parceiro</b><ul>
  <li>O relógio é nosso, fora do iframe, contando até <code>end_at</code>. Nos últimos 5 min fica dourado ("Termina em"); depois do fim fica vermelho e conta a tolerância ("A sala fecha em"). O Prebuilt mostra o aviso dele no mesmo momento — use os botões de relógio lá em cima.</li>
  <li>Presentear chama <code>POST /api/sessoes/[id]/presentear</code>: <code>wallet_ledger gift (+1)</code> + <code>gift_quotas</code> numa transação, chave <code>gift_{bookingId}</code>. Não passa pelo teto da carteira nem pelo contrato da empresa.</li>
  <li>Dois passos, porque o livro-caixa é imutável: presente dado não volta. O botão só existe do início até a sala fechar.</li>
  <li>As bolinhas são a cota do mês (3, não acumula). Cota esgotada: botão some e fica a frase. <button class="link-sm" data-cota0>Ver cota esgotada</button></li>
</ul>`;
const ANOT_PROF=`<b>Anotações — sala do Profissional</b><ul>
  <li>O token é pedido ao abrir a página (<code>POST /api/sessoes/[id]/entrar</code>) e nunca reaproveitado: recarregar pede outro, porque o Prebuilt apaga o <code>?t=</code> da URL depois de ler.</li>
  <li>O presente chega por consulta a cada 15 s ao próprio extrato (RLS de <code>wallet_ledger</code>, chave <code>gift_{bookingId}</code>) — sem webhook nem canal em tempo real. O aviso aparece por cima do vídeo e o saldo da carteira sobe junto.</li>
  <li>Esta é a <b>única</b> animação do produto: a ficha cai girando e brilha uma vez. Com "reduzir movimento" ligado no sistema, aparece parada.</li>
</ul>`;

let segundos=1122, papel="parc", presenteDado=false, cotaRestante=2, timer=null;

function fmt(s){const a=Math.abs(s);return Math.floor(a/60)+":"+String(a%60).padStart(2,"0")}
function pintarRelogio(){
  document.querySelectorAll("[data-clock]").forEach(c=>{
    const t=c.querySelector("[data-t]"),l=c.querySelector("[data-lbl]"),sub=c.querySelector("[data-sub]");
    c.classList.remove("fim","extra");
    if(segundos>300){l.textContent="Faltam";sub.textContent="termina às 09:30";t.textContent=fmt(segundos)}
    else if(segundos>0){c.classList.add("fim");l.textContent="Termina em";sub.textContent="às 09:30";t.textContent=fmt(segundos)}
    else{c.classList.add("extra");l.textContent="A sala fecha em";sub.textContent="passou das 09:30";t.textContent=fmt(300+segundos)}
  });
  document.querySelectorAll(".video").forEach(v=>{
    let a=v.querySelector(".aviso-prebuilt");
    if(segundos<=0&&segundos>-300){if(!a){a=document.createElement("div");a.className="aviso-prebuilt";v.appendChild(a)}a.textContent="A reunião terminará em "+fmt(300+segundos)}
    else if(a)a.remove();
  });
  if(segundos<=-300&&document.querySelector("[data-clock]")){render(papel==="prof"?"fim-prof":"p-sessoes")}
}
function tick(){segundos--;pintarRelogio()}

function montarPresente(){
  const g=document.querySelector("[data-gift]");if(!g)return;
  const dots=[0,1,2].map(i=>`<i class="${i<3-cotaRestante?"used":""}"></i>`).join("");
  if(presenteDado){
    g.innerHTML=`<span class="eyebrow">Presente</span><div class="gift-done anima" style="margin-top:10px"><i class="ficha xl"></i><p><b>Você deu 1 ficha para Mariana.</b><br>Ela vê agora, na tela dela.</p></div>`;return;
  }
  if(cotaRestante===0){
    g.innerHTML=`<span class="eyebrow">Presente</span><div class="gift-q" style="margin-top:10px"><span class="dots">${dots}</span>0 de 3 em setembro</div><p class="muted">Você já deu os 3 presentes de setembro. A cota renova em 1º de outubro.</p>`;return;
  }
  g.innerHTML=`<span class="eyebrow">Presente</span>
    <p style="margin-top:8px;font-size:13.5px">Gostou da conversa e quer que ela continue? Dê 1 ficha para Mariana marcar a próxima — com você ou com quem ela quiser.</p>
    <div class="gift-q" style="margin-top:10px"><span class="dots">${dots}</span>${cotaRestante} de 3 em setembro</div>
    <div data-gift-step><button class="btn gold block" data-presentear><svg class="i"><use href="#gift"/></svg>Presentear 1 ficha</button></div>`;
}

function render(go){
  if(timer){clearInterval(timer);timer=null}
  const app=document.getElementById("app");
  document.querySelectorAll(".proto [data-go]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.go===go));
  if(go==="mobile"){
    papel="parc";
    app.innerHTML=`<div class="phone-wrap"><div class="phone-frame">${document.getElementById("t-sala").innerHTML}</div></div>`;
    prepararSala();return;
  }
  if(go==="sala-prof"||go==="sala-parc"){
    papel=go==="sala-prof"?"prof":"parc";
    app.innerHTML=document.getElementById("t-sala").innerHTML;
    prepararSala();return;
  }
  app.innerHTML=document.getElementById("t-"+go).innerHTML;
  if(go==="p-sessoes"&&presenteDado===false){const s=app.querySelector("#anteriores li .sub");if(s)s.remove()}
  window.scrollTo(0,0);
}
function prepararSala(){
  const app=document.getElementById("app");
  const prof=papel==="prof";
  app.querySelector("[data-ini]").textContent=prof?"HB":"MC";
  app.querySelector("[data-titulo]").textContent=prof?"Sessão com Helena Braga":"Sessão com Mariana Costa";
  app.querySelector("[data-go='__voltar']").dataset.go=prof?"fim-prof":"p-sessoes";
  app.querySelector("[data-panel]").innerHTML=prof?PROF_PANEL:PARC_PANEL;
  const an=app.querySelector("[data-anot]");if(an)an.innerHTML=prof?ANOT_PROF:ANOT_PARC;
  montarPresente();pintarRelogio();
  timer=setInterval(tick,1000);
  window.scrollTo(0,0);
}

document.addEventListener("click",e=>{
  const rel=e.target.closest("[data-rel]");
  if(rel){segundos=Number(rel.dataset.rel);pintarRelogio();return}
  const go=e.target.closest("[data-go]");
  if(go&&go.dataset.go){e.preventDefault();render(go.dataset.go);return}
  if(e.target.closest("[data-presentear]")){
    const st=document.querySelector("[data-gift-step]");
    st.innerHTML=`<div class="gift-confirm">Dar 1 ficha para Mariana? Sai da sua cota de setembro e não pode ser desfeito.</div>
      <div style="display:flex;gap:8px"><button class="btn gold" style="flex:1" data-presente-ok>Presentear</button><button class="btn ghost" data-presente-volta>Voltar</button></div>`;
    st.querySelector("[data-presente-volta]").focus();return;
  }
  if(e.target.closest("[data-presente-volta]")){montarPresente();return}
  if(e.target.closest("[data-presente-ok]")){presenteDado=true;cotaRestante--;montarPresente();return}
  if(e.target.closest("[data-cota0]")){presenteDado=false;cotaRestante=0;montarPresente();return}
  if(e.target.closest("[data-simular-presente]")){
    const v=document.querySelector(".video");if(!v||v.querySelector(".toast"))return;
    const t=document.createElement("div");t.className="toast anima";
    t.innerHTML=`<i class="ficha xl"></i><div><b>Helena te deu 1 ficha</b><small>Presente para você marcar a próxima conversa.</small></div>`;
    v.appendChild(t);
    const s=document.querySelector("[data-saldo]");s.textContent="5";
    const f=document.querySelector("[data-fichas]");const n=document.createElement("i");n.className="ficha";f.appendChild(n);f.parentNode.classList.add("anima");
    setTimeout(()=>t.remove(),7000);return;
  }
  const cor=e.target.closest("[data-corrigir]");
  if(cor){
    const li=cor.closest("li");if(li.querySelector(".fix"))return;
    const box=document.createElement("div");box.className="fix";
    box.innerHTML=`<p>Marcar que João participou? A sessão passa a contar como realizada. A ficha dele não muda — já tinha sido usada. Fica registrado no histórico da operadora.</p><div style="display:flex;gap:7px"><button class="btn sm" data-fix-ok>Ele participou</button><button class="btn ghost sm" data-fix-volta>Voltar</button></div>`;
    li.appendChild(box);cor.hidden=true;return;
  }
  if(e.target.closest("[data-fix-volta]")){const li=e.target.closest("li");li.querySelector(".fix").remove();li.querySelector("[data-corrigir]").hidden=false;return}
  if(e.target.closest("[data-fix-ok]")){const li=e.target.closest("li");li.querySelector(".fix").remove();li.querySelector(".right").innerHTML=`<span class="pill off">Realizada</span>`;li.querySelector(".sub").textContent="Presença corrigida por você.";return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const b=document.querySelector("[data-presente-volta],[data-fix-volta]");if(b)b.click()}});
render(location.hash.slice(1)||"inicio");
</script>
</body>
</html>
